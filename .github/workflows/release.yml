name: Release

# Bumps the version, updates CHANGELOG.md, tags, pushes, creates a GitHub release and publishes to
# npm with provenance. Publishing uses npm trusted publishing (OIDC) when it's configured for this
# repository on npmjs.com, or the NPM_TOKEN secret otherwise.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment"
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        working-directory: packages/react-physics-wheel
        run: pnpm exec release-it ${{ inputs.increment }} --ci --npm.skipChecks --npm.publishArgs=--provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
