name: Release

# Bumps the version, updates CHANGELOG.md, tags, pushes, creates a GitHub release and publishes to
# npm with provenance. Authenticates with the NPM_TOKEN secret when present, otherwise with npm
# trusted publishing (OIDC), which must then be configured for this repository on npmjs.com.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment (auto: derived from Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: auto
      dry_run:
        description: "Dry run: verify everything, including npm auth, without publishing, tagging or pushing"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # release-it only logs its hooks during a dry run, so run the checks and build explicitly.
      - name: Check and build (dry run)
        if: inputs.dry_run
        run: |
          pnpm check
          pnpm --filter betterluck build
      - name: Release
        working-directory: packages/betterluck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--ci --npm.publishArgs=--provenance)
          if [ "$INCREMENT" != "auto" ]; then args=("$INCREMENT" "${args[@]}"); fi
          # With a token, release-it verifies npm auth before changing anything. Trusted
          # publishing has no credentials until publish time, so the checks can't run.
          if [ -z "$NODE_AUTH_TOKEN" ]; then args+=(--npm.skipChecks); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          pnpm exec release-it "${args[@]}"
